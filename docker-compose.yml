services:
  ats:
    build: .
    environment: [SERVICE_TYPE=ats]
    ports: ["8000:8000"]

  sourcing:
    build: .
    environment: [SERVICE_TYPE=sourcing]
    ports: ["8001:8000"]

  transport:
    build: .
    environment: [SERVICE_TYPE=transport]
    ports: ["8002:8000"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana-oss:latest
    ports: ["3000:3000"]
